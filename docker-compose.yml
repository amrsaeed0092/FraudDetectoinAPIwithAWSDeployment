services:
  api:
    container_name: fraud-detection-api
    build:
      context: .
      dockerfile: backend/Dockerfile

    ports:
      - "8000:8000"

    environment:
      APP_NAME: Fraud Detection API
      ENVIRONMENT: docker
      DEBUG: "false"
      LOG_LEVEL: INFO
      API_V1_PREFIX: /api/v1

    volumes:
      - ./model/artifacts:/workspace/model/artifacts:ro

    read_only: true

    tmpfs:
      - /tmp

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s